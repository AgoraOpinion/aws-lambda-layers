name: Release

# Taqt fork: builds the PHP 8.2 ARM images and publishes them to ghcr.io
# The release tag is the PHP version (e.g. 8.2.34), it is also the tag of the published images

on:
    # This workflow can be manually triggered
    workflow_dispatch:
        inputs:
            version:
                description: 'Tag of the published images (PHP version, e.g. 8.2.34)'
                required: true
    # But the main use case is to release new images when a release is created
    release:
        types: [ published ]

permissions:
    contents: read  # This is required for actions/checkout
    packages: write # This is required to push to ghcr.io

jobs:

    release:
        name: Publish arm images
        runs-on: ubuntu-24.04-arm
        timeout-minutes: 60
        env:
            CPU: arm
        steps:
            -   uses: actions/checkout@v6

            -   name: Get the version
                id: get_version
                run: echo "VERSION=${{ github.event.release.tag_name || inputs.version }}" >> $GITHUB_OUTPUT

            -   name: Configure ghcr.io credentials
                uses: docker/login-action@v4
                with:
                    registry: ghcr.io
                    username: ${{ github.actor }}
                    password: ${{ secrets.GITHUB_TOKEN }}

            -   run: make docker-images-php-82

            -   run: make test-82

            -   run: make upload-to-ghcr-php-82
                env:
                    DOCKER_TAG: ${{ steps.get_version.outputs.VERSION }}
